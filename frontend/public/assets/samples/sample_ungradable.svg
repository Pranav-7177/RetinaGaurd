<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="blurBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#451A03" />
      <stop offset="70%" stop-color="#1C1917" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>
    <filter id="severeBlur">
      <feGaussianBlur stdDeviation="22" />
    </filter>
  </defs>

  <circle cx="300" cy="300" r="280" fill="url(#blurBg)" />
  <circle cx="260" cy="280" r="140" fill="#B45309" opacity="0.3" filter="url(#severeBlur)" />
  <!-- Overexposure flare defect / cataract occlusion -->
  <ellipse cx="380" cy="220" rx="90" ry="70" fill="#FEF08A" opacity="0.45" filter="url(#severeBlur)" />
</svg>
